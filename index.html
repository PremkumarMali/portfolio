<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Premkumar Mali | Portfolio</title>
  <meta name="description" content="Portfolio of Premkumar Mali: full-stack web apps and AI tools built with React, Spring Boot and Python.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Premkumar Mali | Portfolio">
  <meta property="og:description" content="Full-stack web apps and AI tools built with React, Spring Boot and Python.">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#0a1020">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the theme before first paint so there is no flash.
    var saved; try { saved = localStorage.getItem("theme"); } catch (e) {}
    document.documentElement.dataset.theme = saved || "dark";
    // Play the intro once per browser session, and never for reduced-motion users.
    try {
      if (!sessionStorage.getItem("intro") && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("intro");
        sessionStorage.setItem("intro", "1");
      }
    } catch (e) {}
  </script>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js",
                   "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script src="data.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="#top" id="brand"></a>
      <button class="icon-btn menu-btn" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav aria-label="Primary">
        <ul id="nav-links">
          <li><a href="#top">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#projects">Work</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#experience">Experience</a></li>
          <li><a href="#certifications">Certifications</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false">
        <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <section id="top" class="hero wrap">
      <canvas class="hero-field" id="hero-field" aria-hidden="true"></canvas>
      <div class="hero-text">
        <p class="hello">Hi, I'm</p>
        <h1 id="hero-name"></h1>
        <p class="hero-meta" id="hero-meta"></p>
        <p class="pitch" id="hero-pitch"></p>
        <div class="hero-foot">
          <div class="actions">
            <a class="btn primary" href="#projects">View projects</a>
            <a class="btn" href="#contact">Contact me</a>
            <a class="btn" id="resume-btn" target="_blank" rel="noopener noreferrer">Resume</a>
          </div>
        </div>
      </div>
      <canvas class="hero-3d" id="hero-3d" aria-hidden="true"></canvas>
      <noscript><p>This site needs JavaScript to show its content.</p></noscript>
    </section>

    <section id="about" class="section wrap" aria-labelledby="about-h">
      <div class="about-grid">
        <div>
          <h2 id="about-h">About</h2>
          <div class="prose" data-fill></div>
        </div>
        <div class="edu-card" id="edu-card"></div>
      </div>
      <ul class="stats" id="about-stats"></ul>
    </section>

    <section id="projects" class="section wrap" aria-labelledby="projects-h">
      <h2 id="projects-h">Selected work</h2>
      <div class="featured" id="featured-list"></div>
      <div id="more-wrap">
        <h3 class="more-h">More projects</h3>
        <div class="more" id="more-list"></div>
      </div>
    </section>


    <section id="skills" class="section wrap" aria-labelledby="skills-h">
      <h2 id="skills-h">Skills</h2>
      <div class="skills" data-fill></div>
    </section>


    <section id="experience" class="section wrap" aria-labelledby="experience-h">
      <h2 id="experience-h">Experience</h2>
      <ol class="rows" data-fill></ol>
    </section>


    <section id="certifications" class="section wrap" aria-labelledby="certifications-h">
      <h2 id="certifications-h">Certifications</h2>
      <ul class="rows" data-fill></ul>
    </section>

    <section id="contact" class="section wrap" aria-labelledby="contact-h">
      <div class="contact">
        <div>
          <h2 id="contact-h">Get in touch</h2>
          <p class="lead" id="contact-intro"></p>
          <ul class="socials" id="contact-socials"></ul>
        </div>
        <form id="contact-form" class="form" method="POST" hidden>
          <div class="field">
            <label for="cf-name">Name</label>
            <input id="cf-name" name="name" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="cf-email">Email</label>
            <input id="cf-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="cf-message">Message</label>
            <textarea id="cf-message" name="message" rows="5" required></textarea>
          </div>
          <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" hidden>
          <button class="btn primary" type="submit">Send message</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <p id="copyright"></p>
      <ul class="socials" id="footer-socials"></ul>
    </div>
  </footer>
</body>
</html>
